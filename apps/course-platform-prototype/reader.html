<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="课程资料智能阅读器"><script>if(location.protocol==='file:')location.replace('http://127.0.0.1:8765/reader.html'+location.search+location.hash);</script><link rel="icon" href="course-logo-v2.svg"><link rel="stylesheet" href="styles.css?v=11"><title>智能阅读器｜人工智能与组织管理</title></head><body class="reader-page">
  <a class="skip-link" href="#reader-document">跳到文档</a>
  <header class="reader-header"><a class="reader-back" href="knowledge.html" aria-label="返回知识广场">←</a><div class="reader-heading"><strong id="reader-title">正在加载资料</strong><small id="reader-meta">课程知识广场</small></div><div class="reader-controls"><button type="button" id="reader-smaller" aria-label="缩小正文">−</button><span id="reader-zoom">100%</span><button type="button" id="reader-larger" aria-label="放大正文">＋</button><button class="reader-mode-button" id="toggle-translation" type="button">中英对照</button><button class="reader-mode-button" id="toggle-ai" type="button">问问 AI</button><a id="reader-download" class="reader-download" href="#" download>下载原文件</a></div></header>
  <main class="reader-workspace" id="reader-workspace">
    <section class="reader-pane reader-source" aria-labelledby="source-pane-title"><div class="pane-header"><div><span>ORIGINAL / 原文</span><strong id="source-pane-title">原始资料</strong></div><small id="selection-hint">选中文字可直接翻译或提问</small></div><div class="reader-document" id="reader-document" tabindex="0"><div class="reader-status" id="reader-status">正在读取文档……</div><article class="document-text" id="document-text"></article><iframe class="pdf-frame" id="pdf-frame" title="PDF 文档"></iframe></div></section>
    <section class="reader-pane translation-pane" id="translation-pane" aria-labelledby="translation-title" hidden><div class="pane-header"><div><span>TRANSLATION / 译文</span><strong id="translation-title">简体中文</strong></div><button class="pane-close" data-close-pane="translation" type="button" aria-label="关闭译文栏">×</button></div><div class="translation-toolbar"><button id="translate-selection" type="button">翻译选中段落</button><button id="translate-current" type="button">翻译当前片段</button><span id="translation-progress">片段 1 / 1</span><button id="translation-prev" type="button" aria-label="上一片段">←</button><button id="translation-next" type="button" aria-label="下一片段">→</button></div><div class="parallel-source" id="parallel-source">原文片段将在这里定位。</div><article class="translation-result" id="translation-result" aria-live="polite">点击“翻译当前片段”，译文会出现在这里。已翻译片段会保存在当前浏览器中。</article></section>
    <aside class="reader-pane ai-pane" id="ai-pane" aria-labelledby="assistant-title" hidden><div class="pane-header"><div><span>QWEN / 文档上下文</span><strong id="assistant-title">课程阅读助手</strong></div><button class="pane-close" data-close-pane="ai" type="button" aria-label="关闭问答栏">×</button></div><div class="chat-thread" id="chat-thread"><div class="chat-message assistant">你可以围绕当前资料继续追问。我会保留本次阅读中的对话上下文。</div></div><div class="suggested-questions"><button type="button">概括这份资料的核心论点</button><button type="button">它与组织理论有什么关系？</button><button type="button">列出三个课堂讨论问题</button></div><form class="chat-composer" id="chat-form"><textarea id="ask-input" rows="3" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea><button type="submit" id="ask-button">发送</button></form><div class="assistant-security">API Key 只保存在服务端环境变量或 macOS 钥匙串中，不会发送到网页。</div></aside>
  </main><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="app.js?v=11"></script></body></html>
