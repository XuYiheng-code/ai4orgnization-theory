allowBuilds:
  '@alicloud/openapi-core': set this to true or false
  '@biomejs/biome': set this to true or false
  '@google/genai': set this to true or false
  '@scarf/scarf': set this to true or false
  canvas: set this to true or false
  core-js: set this to true or false
  es5-ext: set this to true or false
  esbuild: set this to true or false
  msw: set this to true or false
  onnxruntime-node: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
